<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Git Bridge — API Docs</title>
<!-- Pin the version and verify integrity with SRI. This page shares an origin with
     POST /retry/mirror, which triggers real mirror pushes, so a compromised CDN
     would run in that context. Update the integrity hashes together with the version. -->
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.32.11/swagger-ui.css"
      integrity="sha384-9Q2fpS+xeS4ffJy6CagnwoUl+4ldAYhOs9pgZuEKxypVModhmZFzeMlvVsAjf7uT" crossorigin="anonymous">
<style>
  body { margin: 0; }
  #swagger-ui .topbar { display: none; }
</style>
</head>
<body>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/swagger-ui-dist@5.32.11/swagger-ui-bundle.js"
        integrity="sha384-vfl/klfTFrIz5urj0HnhcXLAbzPdRHezizfy+XgFB6GqcKkhlk0lS3bIbyB39NLA" crossorigin="anonymous"></script>
<script>
// The spec lives in a separate file (openapi.json) rather than inline here, so a
// unit test can compare it against the route table on its own.
//
// The URL must stay relative. Today this service is reached directly on its public
// host, but the planned console will sit behind the portal reverse proxy, which
// strips a path prefix before forwarding — an absolute "/openapi.json" would then
// escape to the portal root.
SwaggerUIBundle({
  dom_id: '#swagger-ui',
  deepLinking: true,
  presets: [SwaggerUIBundle.presets.apis],
  layout: "BaseLayout",
  url: "openapi.json"
});
</script>
</body>
</html>
